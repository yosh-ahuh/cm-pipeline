# styles/model-casting.yaml
# 工程別のモデル配役表。fal.ai の1キーで全工程をカバー。
# cut の motion.model 等が未指定なら、ここのデフォルトが適用される。
#
# 【方針】クオリティ最優先＝常に最新モデルを使う。新版が出ていないかは tools/check_models.py で随時確認し、
#         採用前に参照カットで品質A/B（新しい＝常に最善ではないため）。2026-09 に下記へ更新。

still_generation:
  default: seedream-v5-pro        # 最新（v4→v5 Pro）。構図追従・文字・肌質すべて向上
  reason: 高品質最優先。Seedream v5 Pro を既定に
  hi_res_redo: seedream-v5-pro-edit # 甘いスチルを高解像で作り直す（同一構図・同一人物指定）

consistency:                   # 人物一貫性（顔・髪型・服装を固定）
  model: nano-banana-pro       # 最新（Google Nano Banana Pro）
  must_specify: ["顔・髪型・服装を完全一致", "ロゴなし", "ONE single photograph（コラージュ化防止）"]

animation:                     # 動画化（image-to-video）の振り分け
  rule: |
    暗部・ディテール重視カット → kling（細部保持◎。暗所でVeoは甘くなる）
    明部・動きの自然さ重視カット → veo3.1（表情の生命感◎）
    30秒/4K・リップシンク重視 → seedance-2.5（選択肢。品質確認のうえ採用）
  kling:
    model: kling-3-turbo-pro   # 最新（2.5→v3 turbo pro・ネイティブ4K）
    duration: 5
    good_for: [暗いシーン, ディテール勝負, 静的な画]
    caveat: 顔が固まりやすい。顔の微細表情（まばたき・視線移動・眉）を明示振り付けする
  veo:
    model: veo3.1              # 現行トップ（Veo 3.5 未登場のため据置）
    duration: 6s
    resolution: 1080p          # 必須。デフォルト720pは引き伸ばしで甘くなる
    good_for: [明るいシーン, 表情の生命感, カメラワーク]
    must_specify: ["伏し目固定・カメラ目線禁止", "肌ディテール保持", "crisp sharp motion without motion blur"]
    negative: [ghosting, trailing, motion blur, soft focus]
  seedance:                    # 追加の選択肢（cut の motion.model: seedance-2.5 で指定）
    model: seedance-2.5
    resolution: 1080p
    good_for: [長尺, リップシンク, 4K]
  note: 動画アップスケーラーは肌が塗り絵化する。ネイティブ高解像度生成が正解

audio:
  narration: {model: minimax-speech-2.8-hd, voice: Japanese_LoyalKnight}  # 最新（02-hd→2.8-hd）
  bgm:       {model: lyria3-pro}                                          # 最新（Lyria2→Lyria3 Pro）
  sfx:       {model: elevenlabs-sfx-v2, post: 波形解析で頭の無音をトリム}

# 顔がぬるっと・表情が固い問題への根本解（モデル選定では解決しない）
face_quality_fix:
  problem: 暗い引きの画で顔が小さいと Kling=固まる / Veo=甘い のトレードオフ
  solution: 構図で解く。顔を大きく明るくしたバストアップのスチルに撮り直せば両モデルとも改善
  proven: ミライ工事②で実証（Veo寄り構図を採用）
