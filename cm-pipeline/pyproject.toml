[project]
name = "cm-pipeline"
version = "0.1.0"
description = "AIコマーシャル動画制作パイプライン (Phase 1a CLI)"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
cm = "cm.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cm", "cm.adapters"]
