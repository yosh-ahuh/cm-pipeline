name: model-freshness-check
# 「常に最新モデル」を保つための"都度確認"を自動化。
# 週次で fal.ai の公開一覧を照合し、より新しいモデルが出ていればジョブを失敗させて通知
# （GitHub は失敗時にリポジトリ所有者へメール通知。手動実行も可）。FALキー不要・公開APIのみ。
on:
  schedule:
    - cron: '0 0 * * 1'   # 毎週月曜 00:00 UTC
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check for newer AI models (fails if any are found)
        run: python3 tools/check_models.py
