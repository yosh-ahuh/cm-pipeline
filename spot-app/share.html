<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Spot — 共有された動画</title>
<link rel="stylesheet" href="styles/tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font-jp); font-size: var(--t-body); line-height: 1.7; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .mark { width: 28px; height: 28px; border-radius: 50%; border: 5px solid var(--accent); position: relative; }
  .mark::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: #fff; }
  .word { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
  h1 { font-family: var(--font-display); font-size: var(--t-headline); font-weight: 800; margin: 0 0 6px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-1); display: flex; flex-direction: column; }
  .card video { width: 100%; background: #000; display: block; max-height: 420px; }
  .meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; }
  .meta b { font-weight: 700; }
  .meta small { color: var(--muted); display: block; font-size: var(--t-label); }
  .dl { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: var(--r-sm); background: var(--ink); color: var(--ground); font-weight: 700; font-size: var(--t-label); text-decoration: none; white-space: nowrap; }
  .dl:hover { background: #fff; }
  .state { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 40px 24px; text-align: center; color: var(--muted); }
  .state h2 { color: var(--ink); font-size: var(--t-title-lg); margin: 0 0 8px; }
  .foot { margin-top: 36px; color: var(--faint); font-size: var(--t-label); text-align: center; }
  .foot a { color: var(--accent-ink); text-decoration: none; }
  .pill { display: inline-block; font-family: var(--font-mono); font-size: var(--t-label-sm); color: var(--muted); border: 1px solid var(--line-strong); border-radius: var(--r-full); padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
</style>
</head>
<body>
<div class="wrap">
  <header><span class="mark" aria-hidden="true"></span><span class="word">Spot</span></header>
  <h1 id="title">共有された動画</h1>
  <p class="sub" id="sub">読み込んでいます…</p>
  <div id="content" class="grid" hidden></div>
  <div id="state" class="state" hidden></div>
  <p class="foot" id="foot">このページは <span id="expires"></span> まで有効です。 ・ <a href="https://spot.video/" rel="noopener">Spot</a> — 選ぶだけで、広告動画。</p>
</div>
<script src="config.js"></script>
<script>
(async function () {
  const cfg = window.SPOT_CONFIG || {};
  const lang = (navigator.language || 'ja').toLowerCase().startsWith('ja') ? 'ja' : 'en';
  const L = (en, ja) => lang === 'ja' ? ja : en;
  document.documentElement.lang = lang;
  document.title = L('Spot — Shared videos', 'Spot — 共有された動画');
  const $ = id => document.getElementById(id);
  const VAR = { A: L('Pattern A', 'パターン A'), B: L('Pattern B', 'パターン B'), C: L('Pattern C', 'パターン C') };
  const FMT = { youtube: ['16:9', 'YouTube'], wide: ['16:9', L('Landscape', '横')], reels_shorts: ['9:16', L('Reels / Shorts', 'リール・ショート')], vertical: ['9:16', L('Vertical', '縦')], timeline: ['1:1', L('Feed', 'タイムライン')], square: ['1:1', L('Square', '正方形')], signage: ['16:9', L('Signage', 'サイネージ')] };
  const token = new URLSearchParams(location.search).get('t') || '';
  const fail = (title, msg) => { $('sub').hidden = true; $('foot').hidden = true; const st = $('state'); st.hidden = false; st.innerHTML = `<h2></h2><p></p>`; st.querySelector('h2').textContent = title; st.querySelector('p').textContent = msg; };
  if (!cfg.url || !token) return fail(L('Link not found', 'リンクが見つかりません'), L('This share link is incomplete.', 'この共有リンクは不完全です。'));
  try {
    const res = await fetch(cfg.url.replace(/\/$/, '') + '/functions/v1/share?t=' + encodeURIComponent(token), { headers: cfg.anonKey ? { apikey: cfg.anonKey } : {} });
    const data = await res.json();
    if (!res.ok || data.error) return fail(L('This link has expired', 'このリンクは期限切れです'), L('Ask the sender for a new share link.', '送り主に新しい共有リンクを依頼してください。'));
    $('title').textContent = data.name || L('Shared videos', '共有された動画');
    const n = data.files.length;
    $('sub').textContent = n ? L(`${n} ready-to-ship files. Tap a video to play, or save it with the button.`, `配信できる動画 ${n} 本。タップで再生、ボタンで保存できます。`)
                            : L('No files have been exported for this project yet.', 'このプロジェクトはまだ書き出されていません。');
    try { $('expires').textContent = new Date(data.expires_at).toLocaleDateString(lang === 'ja' ? 'ja-JP' : 'en-US'); } catch (_) {}
    const grid = $('content'); grid.hidden = false;
    grid.innerHTML = data.files.map(f => {
      const fm = FMT[f.format] || [f.format, ''];
      return `<div class="card"><video controls preload="metadata" playsinline src="${f.url}"></video>
        <div class="meta"><span><b>${VAR[f.variant] || f.variant}</b><small>${fm[0]} ${fm[1] || ''}</small></span><a class="dl" href="${f.download}" download>↓ ${L('Save', '保存')}</a></div></div>`;
    }).join('');
  } catch (e) {
    fail(L("Couldn't load the videos", '動画を読み込めませんでした'), L('Please try again in a moment.', '少し待ってからもう一度お試しください。'));
  }
})();
</script>
</body>
</html>
